[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msseg"
version = "1.0.0"
description = "Multiple sclerosis lesion segmentation in brain MRI with a 2D U-Net"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Javier Molinero Araguas", email = "jmolinero40@gmail.com" }]
keywords = ["medical-imaging", "segmentation", "multiple-sclerosis", "mri", "u-net", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "torch>=2.3,<3.0",
    "torchvision>=0.15,<1.0",
    "nibabel>=5.0",
    "numpy>=1.24,<3.0",
    "opencv-python-headless>=4.7",
    "scipy>=1.10",
    "PyYAML>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "black>=24.0", "mypy>=1.8"]

[project.urls]
Repository = "https://github.com/jmolinero40/Multiple-Sclerosis-Detection-System-CNN"

[project.scripts]
msseg-preprocess = "msseg.data.preprocess:main"
msseg-splits = "msseg.data.splits:main"
msseg-train = "msseg.train:main"
msseg-evaluate = "msseg.evaluate:main"
msseg-figures = "msseg.figures:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = ["slow: tests that take more than a few seconds"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line length is handled by the formatter

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
